<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>少儿编程课后反馈提示词生成器</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #2563eb;
    --primary-soft: #eff6ff;
    --primary-border: #bfdbfe;
    --ok: #0f766e;
    --shadow: 0 10px 30px rgba(15, 23, 42, .06);
    --radius: 18px;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .container { width: min(1180px, calc(100% - 32px)); margin: 28px auto 60px; }
  .hero {
    background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
    border: 1px solid #e8eef8;
    border-radius: 24px;
    padding: 28px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.25; }
  .subtitle { margin: 0; color: var(--muted); line-height: 1.7; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .section-title h2 { margin: 0; font-size: 20px; }
  .hint { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
  .field label { display:block; font-size:14px; font-weight:700; margin-bottom:7px; }
  input, select, textarea {
    width: 100%; border: 1px solid #d7dce5; border-radius: 12px; padding: 11px 12px;
    font: inherit; color: var(--text); background: #fff; outline: none; transition:.2s;
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { border-color: #7aa7ff; box-shadow: 0 0 0 4px rgba(37,99,235,.08); }
  .full { grid-column: 1 / -1; }
  .tag-section { padding: 18px 0; border-top: 1px dashed var(--line); }
  .tag-section:first-child { border-top: 0; padding-top: 0; }
  .tag-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:12px; }
  .tag-head h3 { margin:0; font-size:16px; }
  .tag-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .small-btn, .btn {
    border:0; border-radius:10px; cursor:pointer; font:inherit; transition:.15s; font-weight:700;
  }
  .small-btn { padding:7px 10px; background:#f3f4f6; color:#374151; font-size:12px; }
  .small-btn:hover { background:#e5e7eb; }
  .tags { display:flex; flex-wrap:wrap; gap:9px; }
  .tag {
    user-select:none; border:1px solid #dce1e8; background:#fff; color:#3f4754;
    padding:8px 11px; border-radius:999px; cursor:pointer; font-size:13px; line-height:1;
    transition:.15s;
  }
  .tag:hover { border-color:#9bbcff; background:#f8fbff; }
  .tag.selected { background:var(--primary-soft); border-color:var(--primary-border); color:#1d4ed8; font-weight:700; }
  .subgroup { margin: 12px 0 4px; font-size:13px; color:#4b5563; font-weight:800; }
  .custom-row { display:flex; gap:8px; margin-top:12px; }
  .custom-row input { flex:1; }
  .custom-row button { white-space:nowrap; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { padding:11px 16px; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-secondary { background:#eef2f7; color:#334155; }
  .btn-secondary:hover { background:#e2e8f0; }
  .btn-success { background:#0f766e; color:#fff; }
  .btn-success:hover { background:#115e59; }
  .output {
    min-height: 420px; white-space: pre-wrap; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 13px; line-height: 1.75; background:#0b1220; color:#e5eefb; border-radius:14px; padding:18px;
    overflow:auto; border:1px solid #111c30;
  }
  .status { min-height: 24px; margin-top:10px; color:var(--ok); font-size:13px; font-weight:700; }
  .sticky-actions { position: sticky; bottom: 12px; z-index: 10; display:flex; justify-content:flex-end; pointer-events:none; }
  .sticky-actions .actions { pointer-events:auto; background:rgba(255,255,255,.92); backdrop-filter: blur(10px); border:1px solid var(--line); padding:10px; border-radius:14px; box-shadow:var(--shadow); }
  .count { color:#2563eb; font-weight:800; }
  @media (max-width: 760px) {
    .container { width:min(100% - 20px, 1180px); margin-top:14px; }
    .hero, .card { padding:18px; border-radius:16px; }
    h1 { font-size:24px; }
    .grid { grid-template-columns:1fr; }
    .full { grid-column:auto; }
    .tag-head { flex-direction:column; }
    .tools { justify-content:flex-start; }
    .sticky-actions { position:static; }
  }

  .ability-category { margin: 18px 0 8px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .ability-category:first-of-type { border-top: 0; padding-top: 0; }
  .ability-category-title { font-size: 14px; font-weight: 800; color: #334155; margin-bottom: 10px; }
  .ability-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .ability-card { border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; background: #fbfdff; }
  .ability-card.has-selection { border-color: var(--primary-border); background: #f8fbff; }
  .ability-name { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; font-weight:800; margin-bottom:9px; }
  .ability-current { color:#2563eb; font-size:11px; font-weight:700; }
  .ability-options { display:flex; flex-wrap:wrap; gap:7px; }
  .ability-option { user-select:none; border:1px solid #dce1e8; background:#fff; color:#475569; padding:7px 9px; border-radius:10px; cursor:pointer; font-size:12px; line-height:1.35; transition:.15s; }
  .ability-option:hover { border-color:#9bbcff; background:#f8fbff; }
  .ability-option.selected { background:var(--primary-soft); border-color:var(--primary-border); color:#1d4ed8; font-weight:700; }
  .ability-selected-summary { margin-top:12px; padding:10px 12px; border-radius:12px; background:#f8fafc; color:#475569; font-size:12px; line-height:1.6; }
  @media (max-width: 760px) { .ability-grid { grid-template-columns: 1fr; } }

  /* 自定义词库管理 */
  .subgroup-block { position: relative; margin-top: 14px; }
  .subgroup-block:first-of-type { margin-top: 8px; }
  .subgroup-title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .subgroup-title-row .subgroup { margin:0; }
  .custom-subgroup { padding: 12px; border:1px dashed #cbd5e1; border-radius:14px; background:#fcfdff; }
  .custom-badge { margin-left:7px; padding:2px 6px; border-radius:999px; background:#f1f5f9; color:#64748b; font-size:10px; font-weight:700; vertical-align:middle; }
  .delete-title-btn { border:0; background:#fff1f2; color:#be123c; border-radius:9px; padding:6px 9px; cursor:pointer; font-size:11px; font-weight:800; }
  .delete-title-btn:hover { background:#ffe4e6; }
  .tag.custom-tag { position:relative; padding-right:11px; overflow:visible; }
  .tag.custom-tag.selected { padding-right:20px; }
  .delete-tag-btn {
    display:none; position:absolute; top:-9px; right:-7px; width:19px; height:19px; padding:0;
    border:2px solid #fff; border-radius:50%; background:#dc2626; color:#fff; cursor:pointer;
    align-items:center; justify-content:center; font-size:14px; line-height:1; font-weight:900;
    box-shadow:0 2px 6px rgba(220,38,38,.28); z-index:2;
  }
  .tag.custom-tag.selected .delete-tag-btn { display:flex; }
  .delete-tag-btn:hover { background:#b91c1c; transform:scale(1.06); }
  .custom-builder { margin-top:16px; padding:14px; border:1px solid #dbe5f3; background:#f8fbff; border-radius:14px; }
  .custom-builder-title { font-size:13px; font-weight:800; color:#334155; margin-bottom:10px; }
  .custom-builder-grid { display:grid; grid-template-columns:minmax(150px,.9fr) minmax(170px,1fr) minmax(220px,1.5fr) auto; gap:9px; align-items:end; }
  .custom-builder-field label { display:block; font-size:11px; color:#64748b; font-weight:800; margin-bottom:5px; }
  .custom-builder-field input, .custom-builder-field select { padding:9px 10px; border-radius:10px; font-size:13px; }
  .custom-builder-note { margin:8px 0 0; color:#64748b; font-size:11px; line-height:1.55; }
  .hidden { display:none !important; }
  .custom-empty { font-size:12px; color:#94a3b8; margin:6px 0 0; }
  .custom-ability-area { margin-top:14px; padding:12px; border:1px dashed #cbd5e1; border-radius:12px; }
  .custom-ability-area .subgroup { margin-top:0; }
  @media (max-width: 900px) { .custom-builder-grid { grid-template-columns:1fr 1fr; } }
  @media (max-width: 560px) { .custom-builder-grid { grid-template-columns:1fr; } }

</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <h1>少儿编程课后反馈提示词生成器</h1>
    <p class="subtitle">适用于 Scratch / Python / C++。只填写课程基础信息，其余内容直接点击关键词标签多选。已扩充完整关键词词库，最后一键生成并复制完整提示词。</p>
  </section>

  <section class="card">
    <div class="section-title"><h2>① 课程基础信息</h2><span class="hint">这部分每节课填写一次</span></div>
    <div class="grid">
      <div class="field"><label>学生姓名</label><input id="student" placeholder="例如：龚佑溪"></div>
      <div class="field"><label>课程类型</label><select id="course"><option>Scratch</option><option>Python</option><option>C++</option><option>其他</option></select></div>
      <div class="field"><label>学生年级</label><input id="grade" placeholder="例如：二年级 / 六年级 / 初一"></div>
      <div class="field"><label>本节课主题</label><input id="topic" placeholder="例如：斯芬克斯的问答"></div>
      <div class="field full"><label>主要知识点</label><textarea id="knowledge" placeholder="只写知识点即可，例如：询问并等待、回答、如果那么否则、广播、接收消息"></textarea></div>
      <div class="field full"><label>课堂完成内容</label><textarea id="content" placeholder="写这节课具体做了什么，例如：制作问答游戏；设置答对和答错剧情；通过广播让两个角色互动"></textarea></div>
    </div>
  </section>

  <section class="card">
    <div class="section-title"><h2>② 点击选择课堂关键词</h2><span class="hint">可多选；不符合的不用选</span></div>
    <div id="tagContainer"></div>
  </section>

  <section class="card">
    <div class="section-title"><h2>③ 生成完整提示词</h2><span class="hint">已选择 <span id="totalCount" class="count">0</span> 个关键词</span></div>
    <div class="actions" style="margin-bottom:14px">
      <button class="btn btn-primary" onclick="generatePrompt()">生成提示词</button>
      <button class="btn btn-success" onclick="copyPrompt()">一键复制</button>
      <button class="btn btn-secondary" onclick="resetAll()">清空全部</button>
    </div>
    <div id="output" class="output">填写基础信息并选择标签后，点击“生成提示词”。</div>
    <div id="status" class="status"></div>
  </section>

  <div class="sticky-actions">
    <div class="actions">
      <button class="btn btn-primary" onclick="generatePrompt()">生成</button>
      <button class="btn btn-success" onclick="copyPrompt()">复制</button>
    </div>
  </div>
</div>

const selected = Object.fromEntries(groups.filter(g => g.key !== 'ability').map(g => [g.key, new Set()]));
const abilitySelections = {};

// 自定义词库：普通栏目按「大组 -> 自定义小标题 -> 关键词数组」保存。
const customSubgroups = Object.fromEntries(groups.filter(g => g.key !== 'ability').map(g => [g.key, {}]));
// 能力模块保持“能力 + 表现”的专用结构；自定义补充也遵循“新增后默认不选、选中后可删除”。
const customAbilityItems = new Set();
const selectedCustomAbilities = new Set();

function escapeHtml(text){
  return String(text).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function getGroup(key){ return groups.find(g=>g.key===key); }
function isSystemTag(groupKey,text){
  const g=getGroup(groupKey); if(!g || !g.subgroups) return false;
  return Object.values(g.subgroups).some(arr=>arr.includes(text));
}
function customTagExists(groupKey,text){
  return Object.values(customSubgroups[groupKey]||{}).some(arr=>arr.includes(text));
}
function subgroupExists(groupKey,title){
  const g=getGroup(groupKey);
  return !!((g && g.subgroups && Object.prototype.hasOwnProperty.call(g.subgroups,title)) || Object.prototype.hasOwnProperty.call(customSubgroups[groupKey]||{},title));
}

function renderTags(){
  const root=document.getElementById('tagContainer');
  root.innerHTML='';
  groups.forEach(g=>{
    const sec=document.createElement('div'); sec.className='tag-section'; sec.dataset.group=g.key;
    sec.innerHTML=`<div class="tag-head"><div><h3>${escapeHtml(g.title)}</h3><p>${escapeHtml(g.desc)}</p></div><div class="tools"><button class="small-btn" onclick="clearGroup('${g.key}')">清空本组</button></div></div>`;
    if(g.type==='ability-performance') renderAbilityPerformance(sec,g);
    else renderRegularGroup(sec,g);
    root.appendChild(sec);
  });
  updateAbilitySummary(); updateCount();
}

function renderRegularGroup(sec,g){
  Object.entries(g.subgroups).forEach(([name,tags])=>{
    renderSubgroup(sec,g.key,name,tags,false);
    const additions=customSubgroups[g.key]?.['__system__'+name]||[];
    if(additions.length) appendCustomTagsToSystemSubgroup(sec,g.key,name,additions);
  });
  Object.entries(customSubgroups[g.key]||{}).filter(([name])=>!name.startsWith('__system__')).forEach(([name,tags])=>renderSubgroup(sec,g.key,name,tags,true));
  renderCustomBuilder(sec,g);
}

function appendCustomTagsToSystemSubgroup(sec,groupKey,name,tags){
  const blocks=[...sec.querySelectorAll('.subgroup-block')];
  const block=blocks.find(b=>b.dataset.subgroup===name); if(!block) return;
  const wrap=block.querySelector('.tags');
  tags.forEach(text=>wrap.appendChild(createTagElement(groupKey,name,text,true)));
}

function renderSubgroup(sec,groupKey,name,tags,isCustomTitle){
  const block=document.createElement('div');
  block.className='subgroup-block'+(isCustomTitle?' custom-subgroup':'');
  block.dataset.subgroup=name;
  const head=document.createElement('div'); head.className='subgroup-title-row';
  const title=document.createElement('div'); title.className='subgroup';
  title.innerHTML=`${escapeHtml(name)}${isCustomTitle?'<span class="custom-badge">自定义</span>':''}`;
  head.appendChild(title);
  if(isCustomTitle){
    const del=document.createElement('button'); del.className='delete-title-btn'; del.type='button'; del.textContent='删除标题';
    del.onclick=()=>deleteCustomTitle(groupKey,name);
    head.appendChild(del);
  }
  block.appendChild(head);
  const wrap=document.createElement('div'); wrap.className='tags';
  tags.forEach(text=>wrap.appendChild(createTagElement(groupKey,name,text,isCustomTitle)));
  block.appendChild(wrap);
  if(isCustomTitle && tags.length===0){
    const empty=document.createElement('div'); empty.className='custom-empty'; empty.textContent='这个自定义标题下还没有关键词。'; block.appendChild(empty);
  }
  sec.appendChild(block);
}

function createTagElement(groupKey,subgroup,text,isCustom){
  const el=document.createElement('span');
  el.className='tag'+(isCustom?' custom-tag':'')+(selected[groupKey].has(text)?' selected':'');
  el.dataset.text=text; el.dataset.subgroup=subgroup;
  const label=document.createElement('span'); label.textContent=text; el.appendChild(label);
  if(isCustom){
    const del=document.createElement('button'); del.type='button'; del.className='delete-tag-btn'; del.title='删除这个自定义关键词'; del.setAttribute('aria-label','删除自定义关键词'); del.textContent='×';
    del.onclick=(e)=>{ e.stopPropagation(); deleteCustomKeyword(groupKey,subgroup,text); };
    el.appendChild(del);
  }
  el.onclick=()=>{
    const willSelect=!el.classList.contains('selected');
    el.classList.toggle('selected',willSelect);
    if(willSelect) selected[groupKey].add(text); else selected[groupKey].delete(text);
    updateCount(); saveState();
  };
  return el;
}

function renderCustomBuilder(sec,g){
  const box=document.createElement('div'); box.className='custom-builder';
  const systemOptions=Object.keys(g.subgroups).map(name=>`<option value="sys:${encodeURIComponent(name)}">${escapeHtml(name)}</option>`).join('');
  const customOptions=Object.keys(customSubgroups[g.key]||{}).filter(name=>!name.startsWith('__system__')).map(name=>`<option value="custom:${encodeURIComponent(name)}">${escapeHtml(name)}（自定义）</option>`).join('');
  box.innerHTML=`
    <div class="custom-builder-title">添加自定义关键词</div>
    <div class="custom-builder-grid">
      <div class="custom-builder-field">
        <label>添加到哪个标题下</label>
        <select id="custom-target-${g.key}" onchange="toggleNewTitleInput('${g.key}')">
          ${systemOptions}${customOptions}<option value="__new__">＋ 新建自定义标题</option>
        </select>
      </div>
      <div class="custom-builder-field hidden" id="new-title-wrap-${g.key}">
        <label>自定义标题</label>
        <input id="custom-title-${g.key}" placeholder="例如：错题订正 / 项目拓展">
      </div>
      <div class="custom-builder-field">
        <label>关键词</label>
        <input id="custom-${g.key}" placeholder="输入要新增的关键词" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustom('${g.key}')}" />
      </div>
      <button class="small-btn" style="height:38px" onclick="addCustom('${g.key}')">添加关键词</button>
    </div>
    <p class="custom-builder-note">新增关键词默认不选择；点击关键词后才会选中，并在右上角出现红色 × 删除按钮。系统自带标题和关键词不能删除。</p>`;
  sec.appendChild(box);
  toggleNewTitleInput(g.key);
}

function toggleNewTitleInput(key){
  const select=document.getElementById('custom-target-'+key);
  const wrap=document.getElementById('new-title-wrap-'+key);
  if(wrap) wrap.classList.toggle('hidden',!select || select.value!=='__new__');
}

function decodeTarget(value){
  if(!value || value==='__new__') return null;
  const idx=value.indexOf(':');
  return idx>=0 ? decodeURIComponent(value.slice(idx+1)) : decodeURIComponent(value);
}

function addCustom(key){
  if(key==='ability'){ addCustomAbility(); return; }
  const input=document.getElementById('custom-'+key);
  const target=document.getElementById('custom-target-'+key);
  if(!input || !target) return;
  const text=input.value.trim();
  if(!text){ alert('请先输入要添加的关键词。'); input.focus(); return; }
  if(isSystemTag(key,text) || customTagExists(key,text)){
    alert('这个关键词已经存在，请直接在词库中选择。'); return;
  }

  let title;
  let createdTitle=false;
  if(target.value==='__new__'){
    const titleInput=document.getElementById('custom-title-'+key);
    title=titleInput ? titleInput.value.trim() : '';
    if(!title){ alert('请填写自定义标题。'); if(titleInput) titleInput.focus(); return; }
    if(subgroupExists(key,title)){
      alert('这个标题已经存在，请直接在“添加到哪个标题下”中选择它。'); return;
    }
    customSubgroups[key][title]=[];
    createdTitle=true;
  }else{
    title=decodeTarget(target.value);
  }

  // 系统标题下新增的自定义关键词也要可独立管理，因此为每个系统标题建立同名“附加词”记录。
  // 保存时用特殊标题键关联，但显示时仍放在原系统标题下方。
  if(!createdTitle && Object.prototype.hasOwnProperty.call(getGroup(key).subgroups,title)){
    const special='__system__'+title;
    if(!customSubgroups[key][special]) customSubgroups[key][special]=[];
    customSubgroups[key][special].push(text);
  }else{
    customSubgroups[key][title].push(text);
  }

  input.value='';
  const titleInput=document.getElementById('custom-title-'+key); if(titleInput) titleInput.value='';
  saveState(); renderTags();
  // 添加后自动定位到刚刚使用的标题；关键词仍保持未选择。
  const sel=document.getElementById('custom-target-'+key);
  if(sel){
    const desired=createdTitle ? `custom:${encodeURIComponent(title)}` : target.value;
    if([...sel.options].some(o=>o.value===desired)) sel.value=desired;
    toggleNewTitleInput(key);
  }
  document.getElementById('status').textContent=`已添加自定义关键词“${text}”，默认未选择。`;
}

function getCustomTitleDisplayName(storageTitle){
  return storageTitle.startsWith('__system__') ? storageTitle.slice('__system__'.length) : storageTitle;
}

function deleteCustomKeyword(groupKey,subgroup,text){
  let storageTitle=subgroup;
  const g=getGroup(groupKey);
  if(g && g.subgroups && Object.prototype.hasOwnProperty.call(g.subgroups,subgroup)) storageTitle='__system__'+subgroup;
  const arr=customSubgroups[groupKey]?.[storageTitle];
  if(!arr) return;
  customSubgroups[groupKey][storageTitle]=arr.filter(x=>x!==text);
  selected[groupKey].delete(text);
  // 系统标题的附加词记录为空时直接清理；真正的自定义标题即使空了也保留，直到用户主动删标题。
  if(storageTitle.startsWith('__system__') && customSubgroups[groupKey][storageTitle].length===0) delete customSubgroups[groupKey][storageTitle];
  saveState(); renderTags();
  document.getElementById('status').textContent=`已删除自定义关键词“${text}”。`;
}

function deleteCustomTitle(groupKey,title){
  if(title.startsWith('__system__')) return;
  const arr=customSubgroups[groupKey]?.[title];
  if(!arr) return;
  const msg=arr.length
    ? `确定删除自定义标题“${title}”吗？\n\n删除后，该标题下关联的 ${arr.length} 个自定义关键词也会全部删除，此操作不可撤销。`
    : `确定删除自定义标题“${title}”吗？此操作不可撤销。`;
  if(!confirm(msg)) return;
  arr.forEach(text=>selected[groupKey].delete(text));
  delete customSubgroups[groupKey][title];
  saveState(); renderTags();
  document.getElementById('status').textContent=`已删除自定义标题“${title}”及其关联关键词。`;
}

function renderAbilityPerformance(sec,g){
  Object.entries(g.abilities).forEach(([category,abilities])=>{
    const cat=document.createElement('div'); cat.className='ability-category';
    const title=document.createElement('div'); title.className='ability-category-title'; title.textContent=category; cat.appendChild(title);
    const grid=document.createElement('div'); grid.className='ability-grid';
    Object.entries(abilities).forEach(([ability,options])=>{
      const card=document.createElement('div');
      card.className='ability-card'+(abilitySelections[ability]?' has-selection':''); card.dataset.ability=ability;
      const head=document.createElement('div'); head.className='ability-name';
      head.innerHTML=`<span>${escapeHtml(ability)}</span><span class="ability-current">${abilitySelections[ability]?'已选择':''}</span>`; card.appendChild(head);
      const wrap=document.createElement('div'); wrap.className='ability-options';
      options.forEach(text=>{
        const el=document.createElement('span'); el.className='ability-option'+(abilitySelections[ability]===text?' selected':''); el.textContent=text;
        el.onclick=()=>selectAbility(ability,text,card,el);
        wrap.appendChild(el);
      });
      card.appendChild(wrap); grid.appendChild(card);
    });
    cat.appendChild(grid); sec.appendChild(cat);
  });
  const summary=document.createElement('div'); summary.className='ability-selected-summary'; summary.id='abilitySummary'; sec.appendChild(summary);

  const area=document.createElement('div'); area.className='custom-ability-area';
  const head=document.createElement('div'); head.className='subgroup-title-row';
  head.innerHTML='<div class="subgroup">自定义能力表现 <span class="custom-badge">自定义</span></div>';
  area.appendChild(head);
  const wrap=document.createElement('div'); wrap.className='tags';
  customAbilityItems.forEach(text=>wrap.appendChild(createCustomAbilityTag(text)));
  area.appendChild(wrap);
  if(customAbilityItems.size===0){ const empty=document.createElement('div'); empty.className='custom-empty'; empty.textContent='还没有自定义能力表现。'; area.appendChild(empty); }
  const custom=document.createElement('div'); custom.className='custom-row';
  custom.innerHTML=`<input id="custom-ability" placeholder="例如：比赛阅读代码时更有耐心" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustom('ability')}" /><button class="small-btn" onclick="addCustom('ability')">添加</button>`;
  area.appendChild(custom);
  const note=document.createElement('div'); note.className='custom-builder-note'; note.textContent='新增后默认不选择；点击后选中，同时出现红色 × 删除按钮。'; area.appendChild(note);
  sec.appendChild(area);
}

function createCustomAbilityTag(text){
  const el=document.createElement('span');
  el.className='tag custom-tag'+(selectedCustomAbilities.has(text)?' selected':'');
  const label=document.createElement('span'); label.textContent=text; el.appendChild(label);
  const del=document.createElement('button'); del.type='button'; del.className='delete-tag-btn'; del.title='删除这个自定义能力表现'; del.textContent='×';
  del.onclick=(e)=>{ e.stopPropagation(); deleteCustomAbility(text); };
  el.appendChild(del);
  el.onclick=()=>{ const on=!el.classList.contains('selected'); el.classList.toggle('selected',on); if(on) selectedCustomAbilities.add(text); else selectedCustomAbilities.delete(text); updateAbilitySummary(); updateCount(); saveState(); };
  return el;
}

function addCustomAbility(){
  const input=document.getElementById('custom-ability'); const text=input?.value.trim(); if(!text) return;
  if(customAbilityItems.has(text)){ alert('这个自定义能力表现已经存在。'); return; }
  customAbilityItems.add(text); input.value='';
  saveState(); renderTags();
  document.getElementById('status').textContent=`已添加自定义能力表现“${text}”，默认未选择。`;
}
function deleteCustomAbility(text){
  customAbilityItems.delete(text); selectedCustomAbilities.delete(text);
  saveState(); renderTags();
  document.getElementById('status').textContent=`已删除自定义能力表现“${text}”。`;
}

function selectAbility(ability,text,card,el){
  const same = abilitySelections[ability]===text;
  if(same) delete abilitySelections[ability]; else abilitySelections[ability]=text;
  card.querySelectorAll('.ability-option').forEach(x=>x.classList.remove('selected'));
  if(!same) el.classList.add('selected');
  card.classList.toggle('has-selection',!same);
  card.querySelector('.ability-current').textContent=!same?'已选择':'';
  updateAbilitySummary(); updateCount(); saveState();
}

function updateAbilitySummary(){
  const el=document.getElementById('abilitySummary'); if(!el) return;
  const arr=abilityListArray();
  el.textContent=arr.length ? `已选择 ${arr.length} 项：${arr.join('；')}` : '尚未选择能力表现。';
}

function clearGroup(key){
  if(key==='ability'){
    Object.keys(abilitySelections).forEach(k=>delete abilitySelections[k]);
    selectedCustomAbilities.clear();
    saveState(); renderTags(); return;
  }
  selected[key].clear();
  saveState(); renderTags();
}
function abilityListArray(){
  const arr=Object.entries(abilitySelections).map(([ability,performance])=>`${ability}：${performance}`);
  selectedCustomAbilities.forEach(x=>arr.push(`自定义：${x}`));
  return arr;
}
function updateCount(){
  const regular=Object.values(selected).reduce((n,set)=>n+set.size,0);
  document.getElementById('totalCount').textContent=regular+Object.keys(abilitySelections).length+selectedCustomAbilities.size;
}
function val(id){ return document.getElementById(id).value.trim() || '未填写'; }
function list(key){
  if(key==='ability') return abilityListArray().join('；') || '未选择';
  return [...selected[key]].join('、') || '未选择';
}

function generatePrompt(){
  const student=val('student'), course=val('course'), grade=val('grade'), topic=val('topic'), knowledge=val('knowledge'), content=val('content');
  const prompt=`你是一位专业的少儿编程老师，熟悉 Scratch、Python、C++ 少儿编程教学，同时擅长从课堂内容、知识掌握、逻辑思维、专注力、独立解决问题能力等方面给家长进行课后反馈。\n\n请根据下面提供的课堂信息，生成一份可以直接发送给家长的课后反馈。\n\n【学生姓名】\n${student}\n\n【课程类型】\n${course}\n\n【学生年级】\n${grade}\n\n【本节课主题】\n${topic}\n\n【本节课主要知识点】\n${knowledge}\n\n【本节课主要课堂内容】\n${content}\n\n【学生课堂状态】\n${list('state')}\n\n【学生知识掌握情况】\n${list('mastery')}\n\n【学生课堂具体表现】\n${list('performance')}\n\n【值得表扬的地方】\n${list('praise')}\n\n【本节课存在的问题】\n${list('problems')}\n\n【测试或练习情况】\n${list('practice')}\n\n【学生能力表现】\n${list('ability')}\n\n【反馈风格参考】\n龚佑溪家长您好，课后反馈如下：[爱心]\n【学生情况】\n     孩子今天上课的状态较好。\n     [太阳]本节课的主题是“斯芬克斯的问答”。狮身人面像向米乐熊提出谜题，玩家输入答案以后，程序会判断答案是否正确，并根据答对或答错让两个角色产生不同的反应。本节课主要学习了：1、继续巩固“询问并等待”和“回答”；2、学习“如果……那么……否则”条件判断；3、学习广播和接收消息；4、通过消息让两个角色配合完成不同的剧情效果。\n     [太阳]今天比较重要的逻辑知识是“如果……那么……否则”。和上一节课相比，孩子不仅需要判断答案是否正确，还要理解如果条件成立就执行答对程序，而条件不成立时会自动进入“否则”的失败程序。今天孩子对条件分支和程序因果关系的理解非常不错[强]。本节课另外一个重要的新知识是“广播消息”。狮身人面像判断答案以后，会分别广播“成功”或“失败”，米乐熊收到对应消息以后再切换造型并做出不同反应。通过这个过程让孩子理解，一个完整作品可以由多个角色分别负责不同任务，再通过发送和接收消息相互配合，逐渐建立程序分工和多角色协作的思维。\n\n【生成要求】\n1. 保持上面参考反馈的整体语气、格式和表达习惯，像老师课后直接发给家长的信息，不写成正式教学报告。\n2. 开头使用“${student==='未填写'?'XXX':student}家长您好，课后反馈如下：[爱心]”，下一行写“【学生情况】”。\n3. 第一部分先简单反馈学生当天整体课堂状态，控制在1—2句话，不要过度夸奖。\n4. 第一段[太阳]介绍本节课主题、课堂完成内容和主要知识点；知识点较多时可以使用“1、2、3、4”归纳。\n5. 第二段[太阳]重点分析1—3个最重要知识点，要说明“知识是什么意思 → 在本节课中怎么使用 → 孩子需要理解什么逻辑 → 对编程思维有什么帮助”，不要只罗列知识点。\n6. 如果是 Scratch，重点结合角色程序、事件、条件判断、循环、变量、广播、克隆、坐标、侦测、角色协作、程序执行顺序等分析，并尽量结合具体作品剧情。\n7. 如果是 Python 或 C++，重点结合变量、输入输出、运算、判断、循环、字符串、列表/数组、函数、算法、代码执行顺序、程序调试等分析，并结合具体代码逻辑说明学生真正理解了什么。\n8. 学生课堂状态、掌握情况、具体表现、亮点、问题、测试情况和能力表现要自然融入反馈，不要机械逐项复述。\n9. “学生能力表现”已经明确给出了能力及当天表现，例如“逻辑思维：能够清晰分析程序前后关系和执行逻辑”。请把它作为学生真实课堂表现依据，不要自行改成相反评价；若与其他更具体的课堂事实冲突，以更具体的课堂事实为准。未选择的能力不要凭空评价。\n10. 对表现较好的地方可以具体表扬；对存在的问题使用温和、客观、可改进的表达，不使用“很差、不会、不行”等负面措辞。\n11. 不要编造没有提供的具体课堂行为。未提供的信息可以不写；允许根据课程知识点分析教学重点，但不能虚构学生表现。\n12. [强]整篇最多使用1—2次，不要堆砌表情。\n13. 语言自然、真实、有老师感，避免“培养核心素养、奠定坚实基础、展现卓越能力”等明显模板化或夸张表达。\n14. 整体篇幅约500—800字；知识点较少时可以适当缩短，避免重复。\n15. 最终只输出完整的家长课后反馈，不解释生成过程，不添加其他说明。`;
  document.getElementById('output').textContent=prompt; document.getElementById('status').textContent='提示词已生成。'; saveState(); return prompt;
}

async function copyPrompt(){
  const text=generatePrompt();
  try { await navigator.clipboard.writeText(text); document.getElementById('status').textContent='已复制到剪贴板，可直接粘贴使用。'; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    document.getElementById('status').textContent='已复制到剪贴板，可直接粘贴使用。';
  }
}
function resetAll(){
  if(!confirm('确定清空本节课填写内容和所有已选项吗？\n\n你自己添加的自定义标题和关键词会保留，不会被删除。')) return;
  ['student','grade','topic','knowledge','content'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('course').value='Scratch';
  Object.values(selected).forEach(set=>set.clear());
  Object.keys(abilitySelections).forEach(k=>delete abilitySelections[k]);
  selectedCustomAbilities.clear();
  document.getElementById('output').textContent='填写基础信息并选择标签后，点击“生成提示词”。';
  document.getElementById('status').textContent='已清空本节课内容；自定义词库已保留。';
  saveState(); renderTags();
}

function serializeCustomSubgroups(){
  return Object.fromEntries(Object.entries(customSubgroups).map(([k,obj])=>[k,Object.fromEntries(Object.entries(obj).map(([title,arr])=>[title,[...arr]]))]));
}

function saveState(){
  const data={
    version:3,
    fields:{student:document.getElementById('student').value,course:document.getElementById('course').value,grade:document.getElementById('grade').value,topic:document.getElementById('topic').value,knowledge:document.getElementById('knowledge').value,content:document.getElementById('content').value},
    selected:Object.fromEntries(Object.entries(selected).map(([k,set])=>[k,[...set]])),
    customSubgroups:serializeCustomSubgroups(),
    abilitySelections:{...abilitySelections},
    customAbilityItems:[...customAbilityItems],
    selectedCustomAbilities:[...selectedCustomAbilities]
  };
  localStorage.setItem('feedbackPromptStateV3',JSON.stringify(data));
}

function migrateUnknownSelectedToCustom(){
  groups.filter(g=>g.key!=='ability').forEach(g=>{
    const unknown=[...selected[g.key]].filter(t=>!isSystemTag(g.key,t) && !customTagExists(g.key,t));
    if(!unknown.length) return;
    const title='历史自定义';
    if(!customSubgroups[g.key][title]) customSubgroups[g.key][title]=[];
    unknown.forEach(t=>{ if(!customSubgroups[g.key][title].includes(t)) customSubgroups[g.key][title].push(t); });
  });
}

function loadState(){
  try{
    let raw=localStorage.getItem('feedbackPromptStateV3');
    let legacy=false;
    if(!raw){ raw=localStorage.getItem('feedbackPromptStateV2'); legacy=!!raw; }
    if(!raw){ raw=localStorage.getItem('feedbackPromptState'); legacy=!!raw; }
    if(!raw) return;
    const data=JSON.parse(raw);
    Object.entries(data.fields||{}).forEach(([k,v])=>{ const el=document.getElementById(k); if(el) el.value=v; });
    Object.entries(data.selected||{}).forEach(([k,arr])=>{ if(!selected[k]) return; arr.forEach(t=>selected[k].add(t)); });

    if(data.customSubgroups){
      Object.entries(data.customSubgroups).forEach(([k,obj])=>{
        if(!customSubgroups[k] || !obj) return;
        Object.entries(obj).forEach(([title,arr])=>{ customSubgroups[k][title]=Array.isArray(arr)?[...new Set(arr)]:[]; });
      });
    }

    Object.assign(abilitySelections,data.abilitySelections||{});
    (data.customAbilityItems||[]).forEach(t=>customAbilityItems.add(t));
    (data.selectedCustomAbilities||[]).forEach(t=>selectedCustomAbilities.add(t));

    // 兼容旧版：旧版自定义关键词没有标题信息且添加后默认已选。
    if(legacy || data.customAbilitySelections){
      (data.customAbilitySelections||[]).forEach(t=>{ customAbilityItems.add(t); selectedCustomAbilities.add(t); });
      migrateUnknownSelectedToCustom();
    }
  }catch(e){ console.warn(e); }
}

loadState();
renderTags();
['student','course','grade','topic','knowledge','content'].forEach(id=>document.getElementById(id).addEventListener('input',saveState));
</script>
